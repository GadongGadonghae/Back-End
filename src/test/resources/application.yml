# 테스트 전용 설정: PostgreSQL 없이 메모리 DB(H2)로 실행해요.
spring:
  datasource:
    url: jdbc:h2:mem:sfaas;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop     # 테스트용 메모리 DB에만 적용돼요
    open-in-view: false
  jackson:
    time-zone: Asia/Seoul       # main application.yml과 같게: 응답 시각에 +09:00

# 테스트 전용 JWT 설정
jwt:
  secret: ${JWT_TEST_SECRET:VGhpcy1pcy1hLXRlc3Qtb25seS1qd3Qtc2lnbmluZy1rZXktMzItYnl0ZXMh}
  expiration-ms: 3600000

sfaas:
  judge:
    enabled: false              # 1초 판정 스케줄러를 꺼요. 판정은 테스트에서 직접 불러요

# 테스트에서는 실제 Mosquitto에 라인 가동 명령이 나가지 않게, 아무도 없는 포트로 (보내기 실패 = lineCommandSent false)
mqtt:
  broker-url: tcp://127.0.0.1:1
