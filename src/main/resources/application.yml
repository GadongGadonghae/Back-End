# 모두가 같은 설정. 비밀번호는 여기에 적지 않아요 (application-local.yml 에 적어요)
spring:
  application:
    name: sfaas
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://localhost:5432/sfaas
    username: sfaas_app
  jpa:
    hibernate:
      ddl-auto: validate        # 바꾸지 마세요. 테이블은 schema.sql 로만 만들어요
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
        format_sql: true
  jackson:
    time-zone: Asia/Seoul

server:
  port: 8080

# 로그인 토큰(JWT). secret은 application-local.yml 에 적어요 (Git에 안 올라감)
jwt:
  expiration-ms: 604800000      # 7일: 프론트 로그인 유지 기간(D-75)과 같게

# MQTT (ingest 패키지에서 사용 예정)
mqtt:
  broker-url: tcp://localhost:1883
  topic-raw: sfaas/raw/#

# AI 계획수정 보고서 (report 패키지). 기본은 Google Gemini 무료 키 (OpenAI 호환, gemini-3.8-flash). 11/19부터 기본은 실제 호출 (mock: false)
# API 키는 application-local.yml 의 ai.report.api-key 또는 환경 변수 AI_REPORT_API_KEY · ANTHROPIC_API_KEY 에 넣어요 (Git에 올리지 않아요)
# 키가 없거나 호출이 실패하면 템플릿 문장으로 대신 만들고, 보고서 화면에 그 이유(fallbackReason)가 나와요
# Claude API(Anthropic 공식 Java SDK, 유료 키)를 쓰려면: AI_REPORT_PROVIDER=anthropic, AI_REPORT_MODEL=claude-opus-5-5 (11/20 ai-cause-trace)
# 키 없이 시연만 할 때: AI_REPORT_MOCK=true
ai:
  report:
    mock: ${AI_REPORT_MOCK:false}
    provider: ${AI_REPORT_PROVIDER:openai}           # openai = Gemini 등 OpenAI 호환 (기본, 무료 키) · anthropic = Claude
    base-url: ${AI_REPORT_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
    api-key: ${AI_REPORT_API_KEY:${ANTHROPIC_API_KEY:}}
    model: ${AI_REPORT_MODEL:gemini-3.8-flash}
    effort: ${AI_REPORT_EFFORT:low}                     # Claude 생각 깊이 (low · medium · high). 보고서 문장은 사실 정리라 low
    timeout-seconds: ${AI_REPORT_TIMEOUT_SECONDS:60}   # LLM 연결·응답 제한 시간 (gemini-3.8-flash는 20초 안팎). 넘으면 템플릿 문장으로 대체
    # 재배정 후보 라인 상태 (RSID). D(고장)·S(계획정지)는 제외. I(대기) 포함 여부는 팀 확정 후 조정
    allocatable-statuses: R,DC,I

# 이 공장의 캠퍼스·공장 구분 (보고서 결재·전송 → 임시 MES 수신함, v0.3.15). 차체 캠퍼스 공장 1에만 도입
plant:
  # 근무 끝 시각 (11/21): AI 보고서가 "이 시각까지 남은 생산능력·납기"로 계산해요. 시연 근무 09:00~18:00. 자정까지면 24:00
  shift-end: ${PLANT_SHIFT_END:18:00}
  campus-id: ${PLANT_CAMPUS_ID:BODY}
  factory-id: ${PLANT_FACTORY_ID:1}

# 슬랙 알림 (notify 패키지, N-01 계획수정 보고서 → 슬랙). Incoming Webhook 1개로 보내요
# 웹훅 주소는 비밀값이라 application-local.yml 의 slack.webhook-url 또는 환경 변수 SLACK_WEBHOOK_URL 에만 넣어요 (Git에 올리지 않아요)
# 요약은 위 ai.report.* LLM 설정을 그대로 써요. 웹훅 없이 메시지 모양만 볼 때: SLACK_MOCK=true (로그에만 찍힘)
slack:
  webhook-url: ${SLACK_WEBHOOK_URL:}
  mock: ${SLACK_MOCK:false}
  timeout-seconds: ${SLACK_TIMEOUT_SECONDS:10}
  app-base-url: ${SLACK_APP_BASE_URL:}   # "보고서 보기" 버튼 주소. 예: http://192.168.203.229 (비우면 버튼 없음)
